[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binderkit"
version = "0.1.0"
description = "De novo binder design pipeline and in-silico metric calibration study"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "biopython>=1.81",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "pre-commit>=3.5"]

[project.scripts]
binderkit = "binderkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binderkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires GPU, network, or a heavy model backend (deselect with -m 'not slow')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # dataclass field defaults via factory are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "N812"]
"studies/*" = ["N806"]  # X for a feature matrix, L for a line accumulator  # aliasing a module as M is fine in tests
